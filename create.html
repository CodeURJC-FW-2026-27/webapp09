<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Computer - PC Parts Catalog</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header class="bg-dark text-white py-3">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="mb-0">PC Parts Catalog</h1>

                <a href="index.html" class="btn btn-outline-light">
                    Home
                </a>
            </div>
        </div>
    </header>


    <!-- Main content -->
    <main class="container my-5">

        <div class="row justify-content-center">

            <div class="col-12 col-lg-8">

                <div class="card shadow-sm">

                    <div class="card-body p-4">

                        <h2 class="mb-4">Create New Computer</h2>

                        <form>

                            <!-- Basic information -->
                            <h4 class="mb-3">Basic Information</h4>

                            <div class="row">

                                <div class="col-12 col-md-6 mb-3">
                                    <label for="name" class="form-label">
                                        Name
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="name"
                                        name="name"
                                        placeholder="Enter computer name"
                                        required>
                                </div>


                                <div class="col-12 col-md-6 mb-3">
                                    <label for="brand" class="form-label">
                                        Brand
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="brand"
                                        name="brand"
                                        placeholder="Enter brand"
                                        required>
                                </div>


                                <div class="col-12 col-md-6 mb-3">
                                    <label for="type" class="form-label">
                                        Type
                                    </label>

                                    <select
                                        class="form-select"
                                        id="type"
                                        name="type"
                                        required>

                                        <option value="" selected disabled>
                                            Select computer type
                                        </option>

                                        <option value="High-End Computer">
                                            High-End Computer
                                        </option>

                                        <option value="Modern Computer">
                                            Modern Computer
                                        </option>

                                        <option value="Low-End Computer">
                                            Low-End Computer
                                        </option>

                                    </select>
                                </div>


                                <div class="col-12 col-md-6 mb-3">
                                    <label for="price" class="form-label">
                                        Price (€)
                                    </label>

                                    <input
                                        type="number"
                                        class="form-control"
                                        id="price"
                                        name="price"
                                        min="0"
                                        step="0.01"
                                        placeholder="0.00"
                                        required>
                                </div>

                            </div>


                          
                            <h4 class="mt-4 mb-3">Description</h4>

                            <div class="mb-3">

                                <label for="description" class="form-label">
                                    Description
                                </label>

                                <textarea
                                    class="form-control"
                                    id="description"
                                    name="description"
                                    rows="5"
                                    placeholder="Describe the computer..."
                                    required></textarea>

                            </div>


                            <!-- Additional information -->
                            <h4 class="mt-4 mb-3">
                                Additional Information
                            </h4>

                            <div class="row">

                                <div class="col-12 col-md-6 mb-3">

                                    <label for="releaseDate" class="form-label">
                                        Release Date
                                    </label>

                                    <input
                                        type="date"
                                        class="form-control"
                                        id="releaseDate"
                                        name="releaseDate"
                                        required>

                                </div>


                                <div class="col-12 col-md-6 mb-3">

                                    <label for="image" class="form-label">
                                        Image
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="image"
                                        name="image"
                                        placeholder="Enter image URL"
                                        required>

                                </div>

                            </div>


                            <!-- Used -->
                            <div class="form-check mt-2 mb-4">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="used"
                                    name="used">

                                <label
                                    class="form-check-label"
                                    for="used">

                                    Used computer

                                </label>

                            </div>


                            <!-- Buttons -->
                            <div class="d-flex justify-content-end gap-2">

                                <a
                                    href="index.html"
                                    class="btn btn-secondary">

                                    Cancel

                                </a>

                                <button
                                    type="submit"
                                    class="btn btn-primary">

                                    Save Computer

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <footer class="bg-dark text-white text-center py-3">

        <div class="container">

            <p class="mb-0">
                PC Parts Catalog
            </p>

        </div>

    </footer>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
